<div class="subpage" id="page-cfets-boc-history">

    <div class="section-a section-a-default">
        <div class="section-a-head">
            <div class="section-a-title">政府债券利率历史数据</div>
        </div>
        <div class="section-a-body">
            
            <div class="section-fm">

                <div class="san-form-row">
                    <div class="san-input-pair san-col-7 san-col-l-7 san-col-m-6 san-col-s-12">
                        <div class="san-input-pair-l">
                            <label class="san-input-label label-ch-2 label-ch-s-4">日期</label>
                        </div>
                        <div class="san-input-pair-m">
                            <input type="text" class="san-input-text san-input-text-inline san-input-text-date" id="sdds-intr-his-start-date" name="" value="" readonly>
                            <label class="san-input-static">至</label>
                            <input type="text" class="san-input-text san-input-text-inline san-input-text-date" id="sdds-intr-his-end-date" name="" value="" readonly>
                        </div>
                    </div>

                    <div class="san-input-pair san-col-5 san-col-l-5 san-col-m-6 san-col-s-12 AR AC-s AC-xs">
                        <form id="form-sdds-intr-his" action="" method="post">
                        <a class="san-btn san-btn-primary" href="javascript:void(0);" onclick="doSearch()">查询</a>
                        <a class="san-btn san-btn-primary resp-mark-1" href="javascript:void(0);" onclick="doExcel()">导出Excel</a>
                        <a class="link-open link-more-2 link-more-2-ar m-t-2" href="/chinese/bkcurvrty/" target="_blank">国债实时收益率曲线</a>
                        </form>
                    </div>
                </div>

            </div>

            <div class="san-datasheet" id="sdds-intr-his-data">
                <div class="san-sheet">
                    <table class="san-sheet-alternating">
                        <colgroup></colgroup>
                        <thead>
                            <tr>
                                <td class="cell AC" data-name="dateString" style="height: 28px;">日期</td>
                                <td class="cell AC" data-name="oneRate">1年期国债收益率</td>
                                <td class="cell AC" data-name="tenRate">10年期国债收益率</td>
                              
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
            
        </div>
        <div class="section-a-foot">
            <div class="san-row">
                <div class="san-col-12 AR AC-s AC-xs">
	                <ul class="san-pagination" id="sdds-intr-pagination"></ul>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">

	var PageSize = 15;
	var PageNum = 1;

	var startDate;
	var endDate;

	$(function() {
		//var stTimer = null;
		$('#sdds-intr-his-start-date').datepicker(
				{
					beforeShow : function(input, inst) {
						//clearTimeout(stTimer);
						CURRENTINPUT = input;
						$('#sdds-intr-his-start-date').datepicker('option',
								'maxDate',
								$('#sdds-intr-his-end-date').val() || null);
					},
					onClose : function(selectedDate) {
						//stTimer = setTimeout(function(){
						//	 $('#sdds-intr-his-end-date').datepicker('option', 'minDate', selectedDate);
						//},300);
					}
				});

		//var edTimer = null;
		$('#sdds-intr-his-end-date').datepicker(
				{
					beforeShow : function(input, inst) {
						//clearTimeout(edTimer);
						CURRENTINPUT = input;
						$('#sdds-intr-his-end-date').datepicker('option',
								'minDate',
								$('#sdds-intr-his-start-date').val() || null);
					},
					onClose : function(selectedDate) {
						//edTimer = setTimeout(function(){
						//	$('#sdds-intr-his-start-date').datepicker('option', 'maxDate', selectedDate);
						//},300);
					}
				});
		$
				.ajax(
						{
							type : "POST",
							url : BK_URL
									+ 'cm-u-bk-currency/SddsIntrRateGovYldHis?lang=CN&pageNum='
									+ PageNum + '&pageSize=' + PageSize,
							dataType : 'json'
						})
				.done(
						function(data) {
							var startDate = data['data']['startDateCN'], endDate = data['data']['endDateCN'];
							$('#sdds-intr-his-start-date').val(startDate)
									.datepicker('option', 'maxDate', endDate);
							$('#sdds-intr-his-end-date').val(endDate)
									.datepicker('option', 'minDate', startDate);
							setParam();
							$('#sdds-intr-his-data')
									.sanDatasheet(
											{
												dataSource : 'local',
												url : data,
												dataHandler : function(data) {
													var $sheet = this;
													return _example_dataFormatter(
															$sheet,
															data['data']['startDateCN'],
															data['records'],
															PageSize);
												}
											});
							createPageSddsIntr(data);
						});

	});

	function createPageSddsIntr(data) {
		//分页
		$('#sdds-intr-pagination').sanPagination({
			onClick : function($li, prevNum) {
				var $this = this;
				if ($li.hasClass('page-next') || $li.hasClass('page-last')) {
					//alert.log(prevNum + ' --> ' + $this.find('.page-number').text());
					var pageNum = $this.find('.page-number').text();
					getSddsIntrData(pageNum);
				}
				if ($li.hasClass('page-prev') || $li.hasClass('page-first')) {
					//alert($this.find('.page-number').text() + ' <--' + prevNum);
					var pageNum = $this.find('.page-number').text();
					getSddsIntrData(pageNum);
				}
			},
			onEnter : function($input, prevNum) {
				var $this = this;
				//alert(prevNum + ' --> ' + $input.val());
				var pageNum = $input.val();
				getSddsIntrData(pageNum);
			}
		}).sanPagination('setup', {
			pageNum : PageNum,
			pageTotal : data.data.pageTotal,
			recordsTotal : data.data.total
		});
	}

	function doSearch() {
		setParam();
		getSddsIntrData(PageNum);
	}

	function getSddsIntrData(pageNum) {
		$
				.ajax(
						{
							type : "POST",
							url : BK_URL
									+ 'cm-u-bk-currency/SddsIntrRateGovYldHis?lang=CN&startDate='
									+ startDate + '&endDate=' + endDate
									+ '&pageNum=' + pageNum + '&pageSize='
									+ PageSize,
							dataType : 'json',
							beforeSend : function() {
								//$('#sdds-intr-his-data').sanMaskLayer({
								//					imgUrl : '/r/cms/chinese/chinamoney/assets/images/load1.gif'
								//				});
							}
						})
				.done(
						function(data) {
							if (data.data.flagMessage != "") {
								alert(data.data.flagMessage);
							}
							$('#sdds-intr-his-data')
									.sanDatasheet(
											{
												dataSource : 'local',
												url : data,
												dataHandler : function(data) {
													var $sheet = this;
													return _example_dataFormatter(
															$sheet,
															data['data']['startDateCN'],
															data['records'],
															PageSize);
												},
												onDone : function() {
													//var $this = this;
													//$this.sanMaskLayer('remove');
												}
											});
							if (pageNum == 1) {
								$('#sdds-intr-pagination').sanPagination(
										'setup', {
											pageNum : PageNum,
											pageTotal : data.data.pageTotal,
											recordsTotal : data.data.total
										});
							}
						});
	}

	function setParam() {
		startDate = $('#sdds-intr-his-start-date').val();
		endDate = $('#sdds-intr-his-end-date').val();
	}

	function doExcel() {
		$
				.ajax(
						{
							type : "POST",
							url : convertURL(BK_URL
									+ 'cm-u-bk-currency/SddsIntrRateGovYldHis?lang=CN&startDate='
									+ startDate + '&endDate=' + endDate),
						})
				.done(
						function(data) {
							if (data.data.flagMessage != "") {
								alert(data.data.flagMessage);
								return;
							} else {
								$("#form-sdds-intr-his")
										.attr(
												"action",
												convertURL(DQSURL
														+ 'cm-u-bk-currency/SddsIntrRateGovYldHisExcel?lang=CN&startDate='
														+ startDate
														+ '&endDate=' + endDate));
								$("#form-sdds-intr-his").submit();
							}
						})

	}
</script>
